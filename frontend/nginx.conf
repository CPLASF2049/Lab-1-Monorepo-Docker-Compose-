server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Small pages only; keep request bodies bounded.
    client_max_body_size 1m;

    # Static page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy: the browser calls the same origin (/api/...), nginx forwards
    # to the backend container over the Compose network by service name.
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Container-local health endpoint (not exposed to browsers).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
